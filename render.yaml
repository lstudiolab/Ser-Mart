services:
  - type: web
    name: ser-mart
    runtime: rust
    plan: free
    region: singapore
    branch: main
    buildCommand: cargo build --release
    startCommand: ./target/release/ser-mart
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RUST_LOG
        value: info

# Configure ADMIN_PASSWORD and DATABASE_URL in the Render dashboard.
# Use a dedicated persistent PostgreSQL database before taking real orders.
# Never commit database credentials to this file.
